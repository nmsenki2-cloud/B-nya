# ---------------------------------------------------------
# Fő szint (rendes szint)
# Összes XP az L. szinthez = level-xp-base * L * (L+1) / 2
# (40-nel: 5. szint = 600 XP, 15. szint = 4800 XP)
# ---------------------------------------------------------
level-xp-base: 40

# true: XP és pénz CSAK a saját zónájában jár (pl. a gyémánt zónában a gyémántérc)
# false: XP bárhol jár, de pénz és VexShard csak a megfelelő zónában
zones-only: true

# true: a zóna a teljes magasságot lefedi (csak a sarkok X és Z koordinátája számít)
zones-ignore-height: true

# A balta a fákon kívül a leveleket is törheti?
axe-can-break-leaves: false

# Pénz kiírása actionbarban (chatben soha nem jelez)
show-money-actionbar: false

# VexShard kiírása actionbarban
show-shards-actionbar: true

# Autopickup: a kiütött blokkok dropjai közvetlenül a táskába kerülnek
autopickup:
  enabled: true          # false: kikapcsolja
  only-in-zones: false   # true: csak a zónákban működik
  pickup-exp: true       # a vanilla XP gömbök is automatikusan a játékoshoz kerülnek

requirements:
  pickaxe-level: 5       # ettől a fő szinttől kap csákányt

# ---------------------------------------------------------
# Rangok és szorzók
# A játékos szorzója: ha van megvásárolt rangja (lent: ranks), akkor annak a szorzója,
# MÁSKÜLÖNBEN az utoljára feloldott bánya szorzója (zones: multiplier).
# A szorzó erre hat (kapcsolható):
# ---------------------------------------------------------
multiplier-applies:
  money: true
  shards: true
  xp: false

# Megvásárolható rangok. A rang meglétét a jogosultság dönti el
# (LuckPermsben egy csoport: group.<név>). Ha a játékosnak van ilyen rangja,
# csak ennek a szorzóját kapja, zónarangot már nem.
ranks:
  vip:
    display: "&aVIP"
    permission: "group.vip"
    multiplier: 30
  vex:
    display: "&5Vex"
    permission: "group.vex"
    multiplier: 50

# ---------------------------------------------------------
# VexShard bolt (/banya shop)
#   slot:     melyik helyre kerül (0-tól; rows * 9 - 1-ig)
#   material: az ikon
#   name, lore: szöveg (& színkódokkal), a lore-ban a %price% az árra cserélődik
#   price:    ár VexShardban
#   commands: konzol parancsok vásárláskor (%player% = a játékos neve)
# A parancsokat írd át a saját pluginjaidnak megfelelően (a lenti KOTH parancs csak példa)!
# ---------------------------------------------------------
shop:
  title: "&5VexShard bolt"
  rows: 3
  items:
    koth:
      slot: 11
      material: BEACON
      name: "&cKOTH indító"
      lore:
        - "&7Elindít egy KOTH eseményt."
        - ""
        - "&7Ár: &d%price% VexShard"
        - "&eKattints a vásárláshoz!"
      price: 500
      commands:
        - "koth start"
    gyemant:
      slot: 15
      material: DIAMOND
      name: "&b16 gyémánt"
      lore:
        - "&7Ár: &d%price% VexShard"
        - "&eKattints a vásárláshoz!"
      price: 100
      commands:
        - "give %player% minecraft:diamond 16"

# ---------------------------------------------------------
# Alapértékek a zónákhoz (egy zóna felülírhatja a sajátjában)
#   money: pénz blokkonként a játékos fő szintje alapján:
#          pénz = base + per-level * (szint - start-level), max: felső határ (0 = nincs)
#          Ezt még megszorozza a játékos szorzója.
#   shard: VexShard esély (0-1) és mennyiség blokkonként (a szorzóval szorozva)
# ---------------------------------------------------------
zone-defaults:
  money: {base: 100, per-level: 100, start-level: 1, max: 500}
  shard: {chance: 0.1, amount: 1}

# ---------------------------------------------------------
# Bányászzónák EGYMÁS UTÁN: a sorrend a bányák sorrendje. Mind PvP-mentes.
# A kulcs a zóna neve a /banya setregion parancsban.
#   display:        a zóna neve a játékosoknak
#   rank:           a zóna rangja (& színkódokkal), %banya_rank%
#   materials:      mely blokkok jutalmazottak (LOGS = az összes fa)
#   required-level: ettől a fő szinttől oldható fel (0 = nincs szintkövetelmény)
#   main-xp:        fő XP egy blokkért
#   multiplier:     a zónarang szorzója
#   unlock:         a bánya FELOLDÁSÁNAK ára (money = pénz, vexshard = VexShard)
#   rank-commands:  (nem kötelező) konzol parancsok feloldáskor, pl. LuckPerms rang adása:
#                   rank-commands: ["lp user %player% parent set fa"]
# Az első zóna (fa) ingyenes.
# FIGYELEM: az árak és szorzók csak kiindulási értékek, hangold őket!
# ---------------------------------------------------------
zones:
  wood:
